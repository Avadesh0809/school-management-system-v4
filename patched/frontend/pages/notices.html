<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notices | SMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/parent.js"></script>
  <script>
    Layout.render("notices", "Notices");
    (function(){
      const root = document.getElementById('page-content');
      if (window.Permission && Permission.isParent()) {
        if (window.ParentView && ParentView.notices) { ParentView.notices(root); return; }
      }

      if (!Layout.requireRoles('*')) return;
      CRUD.mount(root, {
        title: "Notices",
        resource: 'notices',
        endpoint: "/notices",
        columns: [
          {key:'id',label:'ID',sortable:true},
          {key:'title',label:'Title',sortable:true},
          {key:'targetRole',label:'Audience'},
          {key:'publishedOn',label:'Published',sortable:true}
        ],
        formFields: [
          {name:'title',label:'Title',required:true},
          {name:'content',label:'Content',type:'textarea',required:true},
          {name:'targetRole',label:'Audience',type:'select',options:[{value:'',label:'All'},{value:'STUDENT',label:'Students'},{value:'TEACHER',label:'Teachers'},{value:'PARENT',label:'Parents'},{value:'ADMIN',label:'Admins'}]},
          {name:'publishedOn',label:'Publish Date',type:'date'}
        ],
        canCreate: true, canEdit: true, canDelete: true,
        pageSize: 10, defaultSort: 'id'
      });
    })();
  </script>
</body>
</html>
