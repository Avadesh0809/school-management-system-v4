<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fees | SMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/parent.js"></script>
  <script>
    Layout.render("fees", "Fees");
    (function(){
      const root = document.getElementById('page-content');
      if (window.Permission && Permission.isParent()) {
        if (window.ParentView && ParentView.fees) { ParentView.fees(root); return; }
      }

      if (!Layout.requireRoles(["SUPER_ADMIN","ADMIN","ACCOUNTANT","STUDENT","PARENT"])) return;
      const _isOwn = Permission.isStudent() || Permission.isParent();
      const _ep = _isOwn ? "/student/me/fees" : "/fees";
      CRUD.mount(root, {
        title: "Fees",
        resource: 'fees',
        endpoint: _ep,
        columns: [
          {key:'id',label:'ID',sortable:true},
          {key:'studentName',label:'Student'},
          {key:'term',label:'Term'},
          {key:'amount',label:'Amount',sortable:true,render:r=>'₹'+(r.amount||0)},
          {key:'amountPaid',label:'Paid',render:r=>'₹'+(r.amountPaid||0)},
          {key:'dueDate',label:'Due',sortable:true},
          {key:'status',label:'Status',render:r=>{
            const c = r.status==='PAID'?'success':r.status==='PENDING'?'warn':r.status==='OVERDUE'?'danger':'info';
            return '<span class="badge '+c+'">'+UI.escapeHtml(r.status||'')+'</span>';
          }}
        ],
        formFields: [
          {name:'studentId',label:'Student ID',type:'number',required:true},
          {name:'term',label:'Term',required:true,placeholder:'e.g. Term 1 2025'},
          {name:'amount',label:'Amount',type:'number',required:true},
          {name:'dueDate',label:'Due Date',type:'date'},
          {name:'status',label:'Status',type:'select',options:[{value:'PENDING',label:'Pending'},{value:'PARTIAL',label:'Partial'},{value:'PAID',label:'Paid'},{value:'OVERDUE',label:'Overdue'}]}
        ],
        canCreate: true, canEdit: true, canDelete: true,
        pageSize: 10, defaultSort: 'id'
      });
    })();
  </script>
</body>
</html>
