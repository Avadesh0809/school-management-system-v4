<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo">S</div>
      <h1>Forgot password</h1>
      <p class="muted">Enter your email to receive a reset link.</p>
      <form id="f" novalidate>
        <div class="form-group"><label>Email</label><input class="input" name="email" type="email"/></div>
        <button class="btn btn-block" type="submit">Send reset link</button>
        <div style="text-align:center; margin-top:14px;"><a href="login.html" style="font-size:13px;">Back to login</a></div>
      </form>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      if (!UI.validate(form, { email: [{ required: true, email: true }] })) return;
      try { await API.auth.forgot(new FormData(form).get('email')); UI.toast('Reset link sent if email exists', 'success'); }
      catch (err) { UI.toast(err.message || 'Request failed', 'error'); }
    });
  </script>
</body>
</html>
