<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | SMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
    .settings-card { background: var(--card, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 10px; padding: 20px; }
    .settings-card h3 { margin: 0 0 14px; font-size: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display:block; font-size:12px; color: var(--muted, #6b7280); margin-bottom:4px; }
    .field input { width:100%; padding:8px 10px; border:1px solid var(--border, #e5e7eb); border-radius:6px; font-size:14px; box-sizing:border-box; }
    .avatar-lg { width: 120px; height: 120px; border-radius: 50%; background:#eef; display:flex;align-items:center;justify-content:center; font-size:42px; font-weight:600; color:#4338ca; overflow:hidden; margin: 0 auto 14px; }
    .avatar-lg img { width:100%; height:100%; object-fit:cover; }
    .help { font-size: 11px; color: var(--muted, #6b7280); margin-top: 4px; }
    .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  </style>
</head>
<body>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/permissions.js"></script>
  <script>
    Layout.render('settings', 'Profile Settings');

    (async function () {
      const root = document.getElementById('page-content');
      root.innerHTML = '<div class="spinner"></div>';

      let me;
      try { me = await API.auth.me(); }
      catch (e) { UI.toast('Could not load profile: ' + e.message, 'error'); return; }

      const initials = (me.fullName || me.username || 'U').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();

      root.innerHTML = `
        <div class="settings-grid">
          <div class="settings-card">
            <h3>Profile Picture</h3>
            <div class="avatar-lg" id="avatar-preview">${UI.escapeHtml(initials)}</div>
            <div class="field">
              <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/gif,image/webp" />
              <div class="help">JPG, PNG, GIF or WEBP. Maximum size: 500 KB.</div>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" id="upload-avatar">Upload Picture</button>
            </div>
          </div>

          <div class="settings-card">
            <h3>Account Information</h3>
            <div class="field"><label>Username</label><input id="f-username" type="text" value="${UI.escapeHtml(me.username || '')}" /></div>
            <div class="field"><label>Full Name</label><input id="f-fullName" type="text" value="${UI.escapeHtml(me.fullName || '')}" /></div>
            <div class="field"><label>Email</label><input id="f-email" type="email" value="${UI.escapeHtml(me.email || '')}" /></div>
            <div class="field"><label>Phone</label><input id="f-phone" type="text" value="${UI.escapeHtml(me.phone || '')}" /></div>
            <div class="btn-row">
              <button class="btn btn-primary" id="save-profile">Save Changes</button>
            </div>
          </div>

          <div class="settings-card" style="grid-column: 1 / -1;">
            <h3>Change Password</h3>
            <div class="settings-grid" style="grid-template-columns: 1fr 1fr 1fr;">
              <div class="field"><label>Current Password</label><input id="f-oldpass" type="password" autocomplete="current-password" /></div>
              <div class="field"><label>New Password</label><input id="f-newpass" type="password" autocomplete="new-password" /></div>
              <div class="field"><label>Confirm New Password</label><input id="f-confirmpass" type="password" autocomplete="new-password" /></div>
            </div>
            <div class="help">Minimum 6 characters.</div>
            <div class="btn-row">
              <button class="btn btn-primary" id="change-pass">Update Password</button>
            </div>
          </div>
        </div>
      `;

      // Render existing profile image if any
      if (me.profileImagePath) {
        try {
          const blob = await API.fetchBlob('/files/' + encodeURIComponent(me.profileImagePath) + '/view');
          const url = URL.createObjectURL(blob);
          document.getElementById('avatar-preview').innerHTML = `<img src="${url}" alt="avatar">`;
        } catch (e) { /* ignore */ }
      }

      const fileInput = document.getElementById('avatar-file');
      fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (f.size > 500 * 1024) {
          UI.toast('Image must be 500 KB or smaller. Selected: ' + Math.round(f.size/1024) + ' KB', 'error');
          fileInput.value = '';
          return;
        }
        if (!/^image\/(jpeg|jpg|png|gif|webp)$/i.test(f.type)) {
          UI.toast('Only JPG, PNG, GIF or WEBP images are allowed', 'error');
          fileInput.value = '';
          return;
        }
        const url = URL.createObjectURL(f);
        document.getElementById('avatar-preview').innerHTML = `<img src="${url}" alt="preview">`;
      });

      document.getElementById('upload-avatar').onclick = async () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) { UI.toast('Choose an image first', 'error'); return; }
        if (f.size > 500 * 1024) { UI.toast('Image must be 500 KB or smaller', 'error'); return; }
        try {
          await API.auth.uploadProfileImage(f);
          UI.toast('Profile picture updated', 'success');
          await API.auth.me();
          setTimeout(() => location.reload(), 600);
        } catch (e) { UI.toast(e.message, 'error'); }
      };

      document.getElementById('save-profile').onclick = async () => {
        const payload = {
          username: document.getElementById('f-username').value.trim() || null,
          fullName: document.getElementById('f-fullName').value.trim() || null,
          email: document.getElementById('f-email').value.trim() || null,
          phone: document.getElementById('f-phone').value.trim() || null
        };
        if (payload.username && payload.username.length < 3) { UI.toast('Username must be at least 3 characters', 'error'); return; }
        if (payload.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) { UI.toast('Invalid email', 'error'); return; }
        try {
          await API.auth.updateProfile(payload);
          UI.toast('Profile updated', 'success');
          setTimeout(() => location.reload(), 600);
        } catch (e) { UI.toast(e.message, 'error'); }
      };

      document.getElementById('change-pass').onclick = async () => {
        const oldP = document.getElementById('f-oldpass').value;
        const newP = document.getElementById('f-newpass').value;
        const cnfP = document.getElementById('f-confirmpass').value;
        if (!oldP || !newP) { UI.toast('Fill all password fields', 'error'); return; }
        if (newP.length < 6) { UI.toast('New password must be at least 6 characters', 'error'); return; }
        if (newP !== cnfP) { UI.toast('Passwords do not match', 'error'); return; }
        try {
          await API.auth.changePassword(oldP, newP);
          UI.toast('Password changed successfully', 'success');
          document.getElementById('f-oldpass').value = '';
          document.getElementById('f-newpass').value = '';
          document.getElementById('f-confirmpass').value = '';
        } catch (e) { UI.toast(e.message, 'error'); }
      };
    })();
  </script>
</body>
</html>
